services:
  wealthfolio:
    image: ${WF_IMAGE:?Set the exact revision image in deployment.env}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WF_PORT:-18088}:8088"
    volumes:
      - data:/data
      - keys:/run/secrets:ro
    environment:
      WF_LISTEN_ADDR: 0.0.0.0:8088
      WF_DATA_DIR: /data
      WF_DB_PATH: /data/wealthfolio.db
      WF_SECRET_KEY_FILE: /run/secrets/wealthfolio-key
      WF_DB_REQUIRE_ENCRYPTION: "1"
      WF_AUTH_REQUIRED: "true"
      WF_AUTH_PASSWORD_HASH: ${WF_AUTH_PASSWORD_HASH:?Run staging.py init}
      WF_AUTH_TOKEN_TTL_MINUTES: "60"
      WF_COOKIE_SECURE: "false"
      WF_CORS_ALLOW_ORIGINS: "http://localhost:${WF_PORT:-18088},http://127.0.0.1:${WF_PORT:-18088}"
      WF_MCP_ENABLED: "false"
      CONNECT_API_URL: ""
      RUST_LOG: warn
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, "http://127.0.0.1:8088/api/v1/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M
    networks: [staging]
volumes:
  data:
  keys:
networks:
  staging:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
